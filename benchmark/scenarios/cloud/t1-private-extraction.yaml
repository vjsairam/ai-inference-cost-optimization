notes: >-
  T1 private-only extraction baseline. Run the harness in-cluster in benchmark-jobs on the
  CPU/system node group through the gateway ClusterIP. The private provider must be the deployed
  vLLM lab-private model. Fallback must be disabled and serving must remain one replica on one
  GPU. Exclude ten warm-up requests before each measured repeat. Use the frozen extraction-v1
  dataset and baseline-portable structured output mode.
