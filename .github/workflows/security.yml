name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project --no-hashes -o requirements.txt
      - name: Audit dependencies
        run: uvx pip-audit -r requirements.txt --disable-pip --no-deps

      # Container scanning starts with the M3+ container artifact.
