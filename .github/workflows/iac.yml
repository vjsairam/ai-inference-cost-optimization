name: IaC

on:
  push:
    paths:
      - "infra/**"
      - "observability/**"
      - "policy/**"
      - ".github/workflows/iac.yml"
  pull_request:
    paths:
      - "infra/**"
      - "observability/**"
      - "policy/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform initialize without backend
        working-directory: infra/terraform/aws
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform/aws
        run: terraform validate
      - name: Helm lint discovered charts
        shell: bash
        run: |
          mapfile -t charts < <(find infra -type f -name Chart.yaml -print | sort)
          if ((${#charts[@]} == 0)); then
            echo "No Helm charts present yet; M5 will add them."
            exit 0
          fi
          for chart_file in "${charts[@]}"; do
            chart_dir=$(dirname "$chart_file")
            value_args=()
            while IFS= read -r values_file; do
              value_args+=(--values "$values_file")
            done < <(find "$chart_dir" -maxdepth 1 -type f -name 'values*.yaml' -print | sort)
            helm lint "$chart_dir" "${value_args[@]}"
          done
      - name: Non-blocking high-severity configuration scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          hide-progress: true
