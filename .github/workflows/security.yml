name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project --no-hashes -o requirements.txt
      - name: Audit dependencies
        run: uvx pip-audit -r requirements.txt --disable-pip --no-deps

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build --tag inference-gateway:security-scan .
      - name: Scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: inference-gateway:security-scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          hide-progress: true
