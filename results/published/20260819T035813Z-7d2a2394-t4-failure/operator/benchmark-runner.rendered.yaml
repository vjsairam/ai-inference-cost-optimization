apiVersion: v1
kind: Namespace
metadata:
  name: benchmark-jobs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-runner
  namespace: benchmark-jobs
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-runner
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: system
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark-runner
          image: "ghcr.io/vjsairam/inference-gateway@sha256:83bb5895b11472c2a7c4c85652dc9805b1317bf2bbc82a5783443cc0836c7bda"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              if [ "${BENCHMARK_RUN_MODE}" = "exec" ]; then
                exec sleep infinity
              fi
              exec "$@"
            - benchmark-runner
            - python
            - -m
            - inference_gateway.benchmark
            - run
            - --scenario
            - benchmark/scenarios/cloud/t0-managed-baseline.yaml
            - --base-url
            - http://gateway.gateway-system.svc.cluster.local:8080
          env:
            - name: BENCHMARK_RUN_MODE
              value: "exec"
            - name: DEPLOY_MANIFEST
              value: /evidence/deploy-manifest.yaml
            - name: BENCHMARK_TREE_DIRTY
              value: "false"
            - name: BENCHMARK_GIT_SHA
              value: "7d2a2394af1eb269d9d886b90ef6beb12d3fc160"
            - name: BENCHMARK_LOCATION
              value: "OPERATOR_SET_BENCHMARK_LOCATION"
            - name: BENCHMARK_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BENCHMARK_NODE_GROUP
              value: "OPERATOR_SET_BENCHMARK_NODE_GROUP"
            - name: BENCHMARK_WORKLOAD_KIND
              value: "kubernetes-job"
            - name: BENCHMARK_AZ
              value: "OPERATOR_SET_BENCHMARK_AZ"
            - name: BENCHMARK_NETWORK_PATH
              value: "runner Pod -> gateway ClusterIP -> selected provider"
            - name: BENCHMARK_INSTANCE_TYPE
              value: "OPERATOR_SET_BENCHMARK_INSTANCE_TYPE"
            - name: BENCHMARK_GPU_MODEL
              value: "OPERATOR_SET_BENCHMARK_GPU_MODEL"
            - name: BENCHMARK_NODE_OS
              value: "OPERATOR_SET_BENCHMARK_NODE_OS"
            - name: BENCHMARK_GATEWAY_ACCESS
              value: "clusterip"
            - name: BENCHMARK_EXECUTION_ORDER
              value: "OPERATOR_SET_BENCHMARK_EXECUTION_ORDER"
            - name: BENCHMARK_FAILURE_INJECTION
              value: "false"
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: benchmark-runner-secrets
                  key: GATEWAY_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: deploy-manifest
              mountPath: /evidence
              readOnly: true
      volumes:
        - name: deploy-manifest
          configMap:
            name: benchmark-deploy-manifest
            items:
              - key: deploy-manifest.yaml
                path: deploy-manifest.yaml
