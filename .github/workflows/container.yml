name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "src/**"
      - "config/**"
      - "policy/**"
      - "benchmark/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"

permissions: {}

jobs:
  build-smoke-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/inference-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image tags
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "version_tag=0.1.0-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build gateway image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${{ steps.image.outputs.version_tag }}" \
            --tag "${IMAGE_NAME}:${{ steps.image.outputs.sha_tag }}" \
            .
      - name: Smoke test live health endpoint
        shell: bash
        run: |
          container_id=$(docker run -d \
            --publish 127.0.0.1:8080:8080 \
            --env GATEWAY_PROVIDERS_CONFIG=config/local/providers.yaml \
            --env GATEWAY_ROUTING_CONFIG=config/local/routing.yaml \
            --env GATEWAY_AUTH_CONFIG=config/auth.example.yaml \
            --env PRIVATE_VLLM_BASE_URL=http://127.0.0.1:9 \
            --env PRIVATE_VLLM_API_KEY=container-smoke \
            --env MANAGED_PRIMARY_BASE_URL=http://127.0.0.1:9 \
            --env MANAGED_PRIMARY_API_KEY=container-smoke \
            "${IMAGE_NAME}:${{ steps.image.outputs.sha_tag }}")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}
          format: spdx-json
          output-file: inference-gateway.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: inference-gateway-${{ steps.image.outputs.sha_tag }}-sbom
          path: inference-gateway.spdx.json
          if-no-files-found: error
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable image tags
        run: |
          docker push "${IMAGE_NAME}:${{ steps.image.outputs.version_tag }}"
          docker push "${IMAGE_NAME}:${{ steps.image.outputs.sha_tag }}"
