<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>Quality rate by repeat</title>
  <rect width="600" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="300" y="24" text-anchor="middle" font-size="17" font-weight="600">Quality rate by repeat</text>
    <text x="300" y="41" text-anchor="middle" font-size="10">Overall is shown after the measured repeats</text>
    <line x1="58" y1="48" x2="58" y2="222" stroke="#52606d"/>
    <line x1="58" y1="222" x2="580" y2="222" stroke="#52606d"/>
    <line x1="54" y1="222.00" x2="58" y2="222.00" stroke="#52606d"/>
    <text x="50" y="225.00" text-anchor="end" font-size="9">0.0000</text>
    <line x1="54" y1="135.00" x2="58" y2="135.00" stroke="#52606d"/>
    <text x="50" y="138.00" text-anchor="end" font-size="9">0.5000</text>
    <line x1="54" y1="48.00" x2="58" y2="48.00" stroke="#52606d"/>
    <text x="50" y="51.00" text-anchor="end" font-size="9">1.0000</text>
    <text x="123.25" y="242" text-anchor="middle" font-size="10">Repeat 1</text>
    <rect x="90.25" y="111.80" width="66.00" height="110.20" fill="#2563a6">
      <title>0.6333333333333333</title>
    </rect>
    <text x="123.25" y="104.80" text-anchor="middle" font-size="10">0.6333</text>
    <text x="253.75" y="242" text-anchor="middle" font-size="10">Repeat 2</text>
    <rect x="220.75" y="111.22" width="66.00" height="110.78" fill="#2563a6">
      <title>0.6366666666666667</title>
    </rect>
    <text x="253.75" y="104.22" text-anchor="middle" font-size="10">0.6367</text>
    <text x="384.25" y="242" text-anchor="middle" font-size="10">Repeat 3</text>
    <rect x="351.25" y="112.96" width="66.00" height="109.04" fill="#2563a6">
      <title>0.6266666666666667</title>
    </rect>
    <text x="384.25" y="105.96" text-anchor="middle" font-size="10">0.6267</text>
    <text x="514.75" y="242" text-anchor="middle" font-size="10">Overall</text>
    <rect x="481.75" y="111.99" width="66.00" height="110.01" fill="#2563a6">
      <title>0.6322222222222222</title>
    </rect>
    <text x="514.75" y="104.99" text-anchor="middle" font-size="10">0.6322</text>
  </g>
</svg>
