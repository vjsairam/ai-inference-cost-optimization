providers:
  private-vllm:
    kind: openai_compatible
    base_url_env: PRIVATE_VLLM_BASE_URL
    api_key_env: PRIVATE_VLLM_API_KEY
    external: false
    models:
      lab-private:
        upstream_model: "PLACEHOLDER_PINNED_MODEL_ID"
        supports_sampling: true

  managed-primary:
    kind: managed
    adapter: "anthropic"
    api_key_env: MANAGED_PRIMARY_API_KEY
    external: true
    models:
      lab-economy:
        upstream_model: "PLACEHOLDER_ECONOMY_MODEL_ID"
        supports_sampling: true
      lab-premium:
        upstream_model: "PLACEHOLDER_PREMIUM_MODEL_ID"

route_aliases:
  lab-default:
    provider: private-vllm
    model: lab-private
  managed-economy:
    provider: managed-primary
    model: lab-economy
  managed-premium:
    provider: managed-primary
    model: lab-premium

pricing:
  managed-primary:
    lab-economy:
      currency: USD
      effective_date: "2026-08-15"
      input_per_1m: "1.00"
      output_per_1m: "5.00"
      cached_input_per_1m: null
      source_url: "https://platform.claude.com/docs/en/pricing.md"
    lab-premium:
      currency: USD
      effective_date: "2026-08-15"
      input_per_1m: "5.00"
      output_per_1m: "25.00"
      cached_input_per_1m: null
      source_url: "https://platform.claude.com/docs/en/pricing.md"
