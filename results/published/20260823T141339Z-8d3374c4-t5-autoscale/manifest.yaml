  notes: 'T5 private-only KEDA treatment. Restricted traffic must remain on vLLM with
    fallback disabled. Concurrency 64 is twice the pinned max sequence count, which
    is intended to sustain queue depth on one L4 replica and request scale-out to
    replica 2. The repeat count is sized for load duration, not statistical repetition:
    a 2026-08-23 attempt with 3 repeats finished its 900 requests in 20 seconds, before
    the second replica finished its measured 7 minute pod-plus-model cold start, so
    the closed-loop load must persist well past that cold start for the scale event
    to fall inside the measurement window. Measure the queue trigger, scheduling and
    pod-plus-model cold start on the second warm static GPU node, queue behavior,
    and the added cost of two provisioned g6.xlarge nodes. Node provisioning latency
    is out of scope. Karpenter and Spot are not exercised.'
