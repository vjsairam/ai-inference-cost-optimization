<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="700" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Prospera v1 logical architecture — managed vs private vs hybrid inference</text>

  <!-- ===== AWS EKS lab container ===== -->
  <rect x="345" y="70" width="640" height="550" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="365" y="96" font-size="14" font-weight="bold" fill="#475569">AWS EKS ephemeral lab</text>
  <text x="365" y="114" font-size="11.5" fill="#64748b">Terraform · tagged · budget-gated · one-command destroy</text>

  <!-- ===== Client / harness ===== -->
  <rect x="30" y="150" width="260" height="135" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="160" y="177" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Client / benchmark harness</text>
  <text x="46" y="203" font-size="12" fill="#334155">• controlled workload shape</text>
  <text x="46" y="224" font-size="12" fill="#334155">• per-request timestamps</text>
  <text x="46" y="245" font-size="12" fill="#334155">• deterministic task scoring</text>
  <text x="46" y="266" font-size="12" fill="#334155">• fixed runner location</text>

  <!-- ===== Results / cost engine ===== -->
  <rect x="30" y="440" width="260" height="155" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="160" y="467" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#134e4a">Results + cost engine</text>
  <text x="46" y="492" font-size="12" fill="#134e4a">immutable run manifest</text>
  <text x="46" y="513" font-size="12" fill="#134e4a">→ raw records → deterministic eval</text>
  <text x="46" y="534" font-size="12" fill="#134e4a">→ cost per successful task</text>
  <text x="46" y="555" font-size="12" fill="#134e4a">→ break-even scenario grid</text>
  <text x="46" y="576" font-size="12" fill="#134e4a">→ public report</text>
  <line x1="160" y1="285" x2="160" y2="440" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== Gateway ===== -->
  <rect x="385" y="150" width="260" height="220" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="515" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Prospera Inference Gateway</text>
  <text x="515" y="194" text-anchor="middle" font-size="10.5" fill="#3b5bdb">OpenAI-compatible /v1/chat/completions</text>
  <text x="401" y="219" font-size="12" fill="#1e3a8a">• auth (hashed API keys)</text>
  <text x="401" y="240" font-size="12" fill="#1e3a8a">• policy engine — data class,</text>
  <text x="413" y="258" font-size="12" fill="#1e3a8a">workload, quality tier (YAML)</text>
  <text x="401" y="279" font-size="12" fill="#1e3a8a">• provider adapters</text>
  <text x="401" y="300" font-size="12" fill="#1e3a8a">• bounded fallback (pre-stream)</text>
  <text x="401" y="321" font-size="12" fill="#1e3a8a">• telemetry, bounded labels</text>
  <text x="401" y="342" font-size="12" fill="#1e3a8a">• streaming proxy + client TTFT</text>

  <!-- client -> gateway -->
  <line x1="290" y1="215" x2="385" y2="215" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="337" y="200" text-anchor="middle" font-size="10.5" fill="#475569">Bearer key +</text>
  <text x="337" y="235" text-anchor="middle" font-size="10.5" fill="#475569">X-Prospera-*</text>

  <!-- ===== Managed provider (top right, outside lab) ===== -->
  <rect x="1090" y="120" width="280" height="175" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.2"/>
  <text x="1230" y="147" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Managed provider API</text>
  <text x="1230" y="165" text-anchor="middle" font-size="11" fill="#92400e">external SaaS endpoint</text>
  <text x="1106" y="190" font-size="12" fill="#78350f">• one provider, two model tiers:</text>
  <text x="1118" y="208" font-size="12" fill="#78350f">managed-economy / -premium</text>
  <text x="1106" y="229" font-size="12" fill="#78350f">• date-stamped pricing config</text>
  <text x="1106" y="250" font-size="12" fill="#78350f">• billed-usage normalization</text>
  <text x="1106" y="271" font-size="12" fill="#78350f">• fault mock for failure tests</text>

  <!-- gateway -> managed (routed above vLLM) -->
  <line x1="645" y1="185" x2="1090" y2="185" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="865" y="172" text-anchor="middle" font-size="11" fill="#475569">allowed data classes only · policy-bounded fallback</text>

  <!-- ===== vLLM (below managed arrow) ===== -->
  <rect x="710" y="250" width="255" height="165" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/>
  <text x="837" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">Private vLLM server</text>
  <text x="726" y="302" font-size="12" fill="#064e3b">• OpenAI-compatible, streaming</text>
  <text x="726" y="323" font-size="12" fill="#064e3b">• 1× GPU node — on-demand,</text>
  <text x="738" y="341" font-size="12" fill="#064e3b">tainted, EKS accelerated AMI</text>
  <text x="726" y="362" font-size="12" fill="#064e3b">• ClusterIP only, never public</text>
  <text x="726" y="383" font-size="12" fill="#064e3b">• pinned image digest + model</text>
  <text x="738" y="401" font-size="12" fill="#064e3b">revision (boundary E)</text>

  <!-- gateway -> vllm -->
  <line x1="645" y1="330" x2="710" y2="330" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="677" y="318" text-anchor="middle" font-size="10.5" fill="#475569">C · internal</text>

  <!-- ===== Prometheus/Grafana ===== -->
  <rect x="385" y="440" width="260" height="140" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="515" y="467" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#4c1d95">Prometheus + Grafana</text>
  <text x="401" y="492" font-size="12" fill="#4c1d95">• gateway + vLLM /metrics</text>
  <text x="401" y="513" font-size="12" fill="#4c1d95">• DCGM GPU telemetry</text>
  <text x="401" y="534" font-size="12" fill="#4c1d95">• dashboards: economics, SLO,</text>
  <text x="413" y="552" font-size="12" fill="#4c1d95">GPU efficiency, routing/failure</text>

  <!-- DCGM box -->
  <rect x="710" y="470" width="255" height="95" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="837" y="497" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4c1d95">DCGM exporter</text>
  <text x="726" y="521" font-size="11.5" fill="#4c1d95">GPU utilization, memory, power —</text>
  <text x="726" y="539" font-size="11.5" fill="#4c1d95">explains private inference cost</text>

  <!-- scrape arrows (dashed) -->
  <line x1="515" y1="440" x2="515" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <line x1="620" y1="452" x2="757" y2="415" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <line x1="710" y1="512" x2="645" y2="512" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <text x="677" y="500" text-anchor="middle" font-size="10.5" fill="#64748b">scrape</text>

  <!-- boundary D note -->
  <text x="665" y="605" text-anchor="middle" font-size="11" fill="#64748b">D · no prompt/response bodies in telemetry · bounded metric labels only</text>

  <!-- trust boundary B line -->
  <line x1="1040" y1="110" x2="1040" y2="620" stroke="#b45309" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="1040" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">B · policy-gated egress — restricted data never crosses</text>

  <!-- trust boundary A line -->
  <line x1="318" y1="110" x2="318" y2="620" stroke="#334155" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="175" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">A · authenticated, validated metadata</text>

  <!-- legend -->
  <line x1="30" y1="676" x2="70" y2="676" stroke="#64748b" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="78" y="681" font-size="11.5" fill="#475569">trust boundary / lab perimeter</text>
  <line x1="300" y1="676" x2="340" y2="676" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="348" y="681" font-size="11.5" fill="#475569">request path</text>
  <line x1="470" y1="676" x2="510" y2="676" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="518" y="681" font-size="11.5" fill="#475569">metrics scrape</text>
  <text x="1370" y="681" text-anchor="end" font-size="11" fill="#94a3b8">Figure 1 · Prospera AI Inference Cost Optimization · v1.1</text>
</svg>
