nodeSelector:
  accelerator: nvidia

tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule

serviceMonitor:
  enabled: true
  # scrapeTimeout must stay below interval or Prometheus drops the target;
  # the chart default timeout of 25s silently disabled scraping at 15s.
  interval: 30s
  scrapeTimeout: 25s
  additionalLabels:
    app.kubernetes.io/part-of: inference-lab

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

