notes: >-
  T5 private-only KEDA treatment. Restricted traffic must remain on vLLM with fallback disabled.
  Concurrency 64 is twice the pinned max sequence count, which is intended to sustain queue depth
  on one L4 replica and request scale-out to replica 2. Measure the queue trigger, scheduling and
  pod-plus-model cold start on the second warm static GPU node, queue behavior, and the added cost
  of two provisioned g6.xlarge nodes. Node provisioning latency is out of scope. Karpenter and
  Spot are not exercised.
