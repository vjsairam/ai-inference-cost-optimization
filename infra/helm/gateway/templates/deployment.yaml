apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single-replica lab: replace in place instead of surging, so config
  # rollouts do not need headroom for a second pod on the system node.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
          args:
            - --factory
            - inference_gateway.main:build_app
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.service.targetPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- range $name := list "GATEWAY_PROVIDERS_CONFIG" "GATEWAY_ROUTING_CONFIG" "GATEWAY_AUTH_CONFIG" "GATEWAY_SLO_CONFIG" "PRIVATE_VLLM_BASE_URL" }}
            - name: {{ $name }}
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: {{ $name }}
            {{- end }}
            - name: MANAGED_PRIMARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.managedPrimaryApiKeyKey }}
            - name: PRIVATE_VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.privateVllmApiKeyKey }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: gateway-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
