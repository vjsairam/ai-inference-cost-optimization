apiVersion: v1
kind: Namespace
metadata:
  name: benchmark-jobs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-runner
  namespace: benchmark-jobs
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-runner
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: system
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark-runner
          image: "BENCHMARK_RUNNER_IMAGE"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              if [ "${BENCHMARK_RUN_MODE}" = "exec" ]; then
                exec sleep infinity
              fi
              exec "$@"
            - benchmark-runner
            - python
            - -m
            - inference_gateway.benchmark
            - run
            - --scenario
            - benchmark/scenarios/cloud/t0-managed-baseline.yaml
            - --base-url
            - http://gateway.gateway-system.svc.cluster.local:8080
          env:
            - name: BENCHMARK_RUN_MODE
              value: "exec"
            - name: DEPLOY_MANIFEST
              value: /evidence/deploy-manifest.yaml
            - name: BENCHMARK_TREE_DIRTY
              value: "false"
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: benchmark-runner-secrets
                  key: GATEWAY_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: deploy-manifest
              mountPath: /evidence
              readOnly: true
      volumes:
        - name: deploy-manifest
          configMap:
            name: benchmark-deploy-manifest
            items:
              - key: deploy-manifest.yaml
                path: deploy-manifest.yaml
