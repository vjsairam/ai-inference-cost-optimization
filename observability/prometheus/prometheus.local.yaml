global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - observability/alerts/local-placeholder.rules.yaml

scrape_configs:
  - job_name: inference-gateway-local
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          environment: local
